# ZedG fork: build the Windows installer and publish it as a GitHub Release,
# which installed ZedG builds pick up through auto-update.
name: ZedG Bundle (reusable)

on:
  workflow_call:
    inputs:
      profile:
        description: "Cargo profile: ci-test (quick) or release (full)"
        type: string
        required: true
      prerelease:
        description: "Publish as a pre-release (test build)"
        type: boolean
        required: true

permissions:
  contents: write

jobs:
  bundle_windows:
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show disk space
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}}

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Set build stamp
        shell: pwsh
        run: |
          $stamp = (Get-Date).ToUniversalTime().ToString('yyyyMMddHHmm')
          "ZEDG_BUILD_STAMP=$stamp" >> $env:GITHUB_ENV
          Write-Host "Build stamp: $stamp"

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup show active-toolchain
          rustc --version

      - name: Build installer
        shell: pwsh
        run: ./script/bundle-windows-zedg.ps1 -Profile ${{ inputs.profile }} -Repo ${{ github.repository }}

      - name: sccache stats
        if: always()
        shell: pwsh
        run: sccache --show-stats

      - name: Show disk space after build
        if: always()
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZedG-${{ env.ZEDG_BUILD_STAMP }}-${{ inputs.profile }}
          path: ${{ env.SETUP_PATH }}
          retention-days: 7

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
          PROFILE: ${{ inputs.profile }}
        run: |
          $tag = "zedg-$env:ZEDG_BUILD_STAMP"
          $sha = $env:GITHUB_SHA.Substring(0, 9)
          $subject = git log -1 --format=%s
          $kind = if ($env:PRERELEASE -eq 'true') { 'Test build' } else { 'Release build' }
          $notes = @(
            "$kind ($env:PROFILE profile) of ZedG, an unofficial fork of Zed.",
            "",
            "Commit: $sha - $subject",
            "",
            "Installed ZedG picks this up through auto-update. First install: download ZedG-x86_64-setup.exe below."
          ) -join "`n"
          # Pass notes through a file: multi-line arguments get mangled on Windows.
          $notesFile = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          Set-Content -Path $notesFile -Value $notes -Encoding utf8
          $flag = if ($env:PRERELEASE -eq 'true') { '--prerelease' } else { '--latest' }
          gh release create $tag "$env:SETUP_PATH" --target "$env:GITHUB_SHA" --title "ZedG $env:ZEDG_BUILD_STAMP ($kind)" --notes-file $notesFile $flag

      - name: Prune old test builds
        if: inputs.prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep the 5 newest test builds; full releases are never pruned.
          gh release list --limit 100 --json tagName,isPrerelease,createdAt |
            ConvertFrom-Json |
            Where-Object { $_.isPrerelease -and $_.tagName -like 'zedg-*' } |
            Sort-Object createdAt -Descending |
            Select-Object -Skip 5 |
            ForEach-Object { gh release delete $_.tagName --yes --cleanup-tag }
